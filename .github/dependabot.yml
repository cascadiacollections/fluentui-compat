version: 2
# Each ecosystem is grouped into one PR and waits 7 days before proposing a new
# release. Security updates are not grouped or delayed by this file.
updates:
  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    cooldown:
      default-days: 7

  # npm packages. There is no root package.json: Rush itself is pinned in
  # rush.json. Both packages share common/config/rush/pnpm-lock.yaml, so one
  # PR across both directories avoids two PRs conflicting on the lockfile
  # (dependabot-lockfile-update.yml refreshes it on the PR).
  - package-ecosystem: "npm"
    directories:
      - "/packages/fluentui-compat"
      - "/packages/fluentui-compat-webpack-plugin"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
    labels:
      - "dependencies"
      - "npm"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    open-pull-requests-limit: 10
    # ts-jest does not support TypeScript 7 yet (its peer range is
    # ">=4.3 <7"), and TypeScript 7 removed moduleResolution=node10, which
    # fluentui-compat's tsconfig relies on. A major bump breaks `tsc` and every
    # test suite (see #244). Re-evaluate once ts-jest ships TypeScript 7
    # support. Minor and patch updates still flow through the npm group.
    ignore:
      - dependency-name: "typescript"
        update-types:
          - "version-update:semver-major"
    groups:
      npm:
        patterns: ["*"]
    cooldown:
      default-days: 7
